name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release (OCCT 7.6, apt) + Python
            preset: linux-release
            python: ON
          - name: GCC Debug + ASan/UBSan
            preset: linux-asan
            python: OFF
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev libocct-ocaf-dev libocct-visualization-dev occt-misc \
            libtbb-dev libfreetype-dev libfontconfig1-dev libx11-dev libgl-dev libxi-dev \
            libeigen3-dev nlohmann-json3-dev catch2 \
            python3-dev python3-pybind11 python3-numpy python3-matplotlib python3-pytest \
            python3-nbclient python3-ipykernel python3-ipywidgets
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DBLADEGEN_BUILD_PYTHON=${{ matrix.python }} -DPython_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:alloc_dealloc_mismatch=0
          UBSAN_OPTIONS: print_stacktrace=1
          MPLBACKEND: Agg
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  windows:
    name: Windows MSVC Release (OCCT 7.9, conda-forge) + Python
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bladegen
          create-args: >-
            python=3.12 occt=7.9 eigen=3.4 nlohmann_json catch2=3 pybind11 ninja cmake
            numpy matplotlib pytest nbclient ipykernel ipywidgets
          init-shell: powershell
          cache-environment: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: |
          $env:PATH = "$env:MAMBA_ROOT_PREFIX\envs\bladegen\Library\bin;$env:MAMBA_ROOT_PREFIX\envs\bladegen;$env:PATH"
          cmake --preset windows-msvc-release -DBLADEGEN_BUILD_PYTHON=ON `
            -DCMAKE_PREFIX_PATH="$env:MAMBA_ROOT_PREFIX\envs\bladegen\Library" `
            -DPython_EXECUTABLE="$env:MAMBA_ROOT_PREFIX\envs\bladegen\python.exe"
      - name: Build
        run: |
          $env:PATH = "$env:MAMBA_ROOT_PREFIX\envs\bladegen\Library\bin;$env:MAMBA_ROOT_PREFIX\envs\bladegen;$env:PATH"
          cmake --build build/windows-msvc-release --parallel
      - name: Test
        env:
          MPLBACKEND: Agg
        run: |
          $env:PATH = "$env:MAMBA_ROOT_PREFIX\envs\bladegen\Library\bin;$env:MAMBA_ROOT_PREFIX\envs\bladegen;$env:PATH"
          ctest --test-dir build/windows-msvc-release --output-on-failure

  macos:
    name: macOS AppleClang Release (OCCT 7.9, conda-forge) + Python
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bladegen
          create-args: >-
            python=3.12 occt=7.9 eigen=3.4 nlohmann_json catch2=3 pybind11 ninja cmake
            numpy matplotlib pytest nbclient ipykernel ipywidgets
          init-shell: bash
          cache-environment: true
      - name: Configure
        run: cmake --preset macos-release -DBLADEGEN_BUILD_PYTHON=ON -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DPython_EXECUTABLE="$CONDA_PREFIX/bin/python"
      - name: Build
        run: cmake --build build/macos-release --parallel
      - name: Test
        env:
          MPLBACKEND: Agg
        run: ctest --test-dir build/macos-release --output-on-failure
